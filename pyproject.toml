[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-cloud-detector"
version = "0.1.0"
description = "ViTA cloud and cloud-shadow detector for Balkan-1 and Sentinel-2 imagery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
  {name = "ViTA / SpaceChallenges26 Team"}
]
dependencies = [
  "numpy>=2.0,<3",
  "omnicloudmask==1.7.1",
  "Pillow>=10",
  "rasterio>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[project.scripts]
vita-cloud-detector = "vita_cloud_detector.cli:main"

[project.urls]
Repository = "https://github.com/Gab1604/Vita-CloudDetector"
OmniCloudMask = "https://github.com/DPIRD-DMA/OmniCloudMask"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
